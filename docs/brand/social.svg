<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="cloud-tools — multi-cloud cost and waste analysis for AI agents">
  <title>cloud-tools</title>
  <defs>
    <linearGradient id="tile" x1="80" y1="248" x2="248" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0369a1"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="rule" x1="80" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0369a1"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- GitHub renders these cards on both light and dark chrome, so the card
       carries its own dark ground rather than inheriting one. -->
  <rect width="1280" height="640" fill="#07131a"/>

  <!-- The mark, from icon.svg by transform — same reason the wordmark does it:
       re-drawing is how three copies of a logo stop being the same logo.
       168/512 = 0.328125 -->
  <rect x="80" y="80" width="168" height="168" rx="46" fill="url(#tile)"/>
  <g transform="translate(80 80) scale(0.328125)">
    <g fill="#fff">
      <circle cx="256" cy="184" r="78"/>
      <circle cx="180" cy="209" r="56"/>
      <circle cx="330" cy="209" r="58"/>
      <rect x="124" y="190" width="264" height="76" rx="38"/>
      <rect x="148" y="308" width="56" height="104" rx="20"/>
      <rect x="228" y="344" width="56" height="68" rx="20"/>
      <rect x="308" y="380" width="56" height="32" rx="16"/>
    </g>
  </g>

  <g font-family="'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="288" y="152" font-size="86" font-weight="700" letter-spacing="-3" fill="#f2f8f6">cloud-tools</text>
    <text x="288" y="212" font-size="34" font-weight="500" fill="#89a7ae">Multi-cloud cost and waste analysis for AI agents</text>

    <rect x="80" y="316" width="640" height="3" fill="url(#rule)"/>

    <!-- The claim that makes the project worth installing, stated as what it
         answers rather than as an adjective. -->
    <text x="80" y="392" font-size="40" font-weight="600" fill="#f2f8f6">Ask what you spend, and what is wasted</text>
    <text x="80" y="446" font-size="30" font-weight="400" fill="#89a7ae">Idle · oversized · previous generation · unattached · unused commitments</text>

    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
      <text x="80" y="530" font-size="30" fill="#89a7ae"><tspan fill="#34d399">13 tools</tspan> <tspan fill="#4d6b73">across</tspan> AWS <tspan fill="#4d6b73">·</tspan> GCP <tspan fill="#4d6b73">·</tspan> Cloudflare <tspan fill="#4d6b73">·</tspan> OVH</text>
      <text x="80" y="578" font-size="26" fill="#4d6b73">npx -y @munhq/cloud-tools · AWS, GCP, Cloudflare, OVH · Apache-2.0</text>
    </g>
  </g>
</svg>
